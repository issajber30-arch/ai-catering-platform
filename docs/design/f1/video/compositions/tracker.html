  <script>
    const tl = gsap.timeline({ paused: true });
    // Geometry: screen origin (345,70) in the frame; tracker image scaled k into the phone.
    const k = 440 / 780;
    const W0 = { s: 1, x: 0, y: 0 };
    const W1 = { s: 1.75, x: -369.8, y: -525.2 };  // sector cards
    const W2 = { s: 1.75, x: -398.3, y: -76 };     // status card
    const P = (nx, ny, w) => ({ x: w.x + w.s * (345 + nx * k), y: w.y + w.s * (70 + ny * k) });
    const world = (w, t, d) => tl.to("#tr-world", { scale: w.s, x: w.x, y: w.y, duration: d, ease: "power2.inOut" }, t);
    const move = (p, t, d) => tl.to("#tr-cursor", { x: p.x, y: p.y, duration: d, ease: "power3.inOut" }, t);
    const click = (t, p) => {
      tl.to("#tr-cursor", { scale: 0.82, duration: 0.07, ease: "power2.in", transformOrigin: "0 0" }, t)
        .to("#tr-cursor", { scale: 1, duration: 0.12, ease: "power2.out" }, t + 0.07);
      tl.set("#tr-ripple", { x: p.x, y: p.y }, t);
      tl.fromTo("#tr-ripple", { scale: 0.3, opacity: 0.9 }, { scale: 1.6, opacity: 0, duration: 0.35, ease: "expo.out" }, t);
    };
    const line = (id, t) => tl.fromTo(id, { opacity: 0, filter: "blur(6px)", borderLeftColor: "#ff1e00" },
      { opacity: 1, filter: "blur(0px)", borderLeftColor: "#333a4a", duration: 0.25, ease: "power4.out" }, t);

    // initial states
    tl.set("#tr-world", { scale: 1, x: 0, y: 0, transformOrigin: "0 0" }, 0);
    tl.set("#tr-cursor", { x: 1500, y: 1150, scale: 1 }, 0);

    // arrive: phone whips in from the right
    tl.fromTo("#tr-phone", { x: 1100 }, { x: 0, duration: 0.5, ease: "expo.out" }, 0);
    tl.fromTo("#tr-kick", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.3);
    tl.fromTo("#tr-w1", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13 }, 0.4);
    tl.fromTo("#tr-w2", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13 }, 0.47);

    // DRS
    const drs = P(163, 324, W0);
    tl.fromTo("#tr-cursor", { opacity: 0 }, { opacity: 1, duration: 0.1 }, 1.0);
    move(drs, 1.0, 0.7);
    click(1.85, drs);
    tl.fromTo("#tr-drs", { opacity: 0 }, { opacity: 1, duration: 0.12 }, 1.86)
      .to("#tr-drs", { opacity: 0.55, duration: 0.5, ease: "power2.out" }, 2.1);
    line("#tr-l1", 1.95);

    // punch in on the sector cards, click S1
    world(W1, 2.5, 0.6);
    const s1 = P(617, 955, W1);
    move(s1, 2.5, 0.8);
    click(3.45, s1);
    tl.fromTo("#tr-s1", { opacity: 0 }, { opacity: 1, duration: 0.1 }, 3.46);
    tl.fromTo("#tr-s1f", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 3.5);
    tl.to("#tr-s1", { borderColor: "#22c55e", duration: 0.2 }, 4.0);
    tl.to("#tr-s1f", { backgroundColor: "#22c55e", duration: 0.2 }, 4.0);
    tl.to("#tr-s1k", { color: "#22c55e", duration: 0.2 }, 4.0);
    tl.to("#tr-s1a", { opacity: 0, duration: 0.12 }, 4.0);
    tl.fromTo("#tr-s1b", { opacity: 0 }, { opacity: 1, duration: 0.12 }, 4.05);
    line("#tr-l2", 4.05);

    // sector 2 goes live, counter runs
    tl.fromTo("#tr-s2", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, 4.3);
    tl.fromTo("#tr-s2f", { scaleX: 0 }, { scaleX: 0.42, duration: 2.4, ease: "none" }, 4.3);
    const clock = { v: 0 };
    tl.fromTo(clock, { v: 0 }, { v: 7.418, duration: 2.4, ease: "none",
      onUpdate: () => { const el = document.getElementById("tr-s2t"); if (el) el.textContent = "00:0" + clock.v.toFixed(3); } }, 4.3);
    move(P(390, 955, W1), 4.2, 0.5);
    line("#tr-l3", 4.5);

    // pan to the status card: Box Box becomes Flying Lap
    world(W2, 5.2, 0.6);
    move(P(440, 512, W2), 5.2, 0.7);
    tl.fromTo("#tr-status", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power4.out" }, 6.0);
    line("#tr-l4", 6.1);

    // back out, ask the race engineer
    world(W0, 6.9, 0.6);
    const ask = { x: 458, y: 968 };
    move(ask, 6.9, 0.6);
    click(7.55, ask);
    tl.fromTo("#tr-bubble", { opacity: 0, y: 40, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "expo.out" }, 7.65);
    line("#tr-l5", 7.8);

    // whip out left toward the Pit Wall
    tl.to(["#tr-world", "#tr-panel"], { x: "-=1400", duration: 0.35, ease: "power3.in" }, 10.15);
    tl.to("#tr-cursor", { x: "-=1400", duration: 0.35, ease: "power3.in" }, 10.15);
    window.__timelines["tracker"] = tl;
  </script>
