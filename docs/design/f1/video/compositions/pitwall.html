  <script>
    const tl = gsap.timeline({ paused: true });
    // Content origin (80,154) in the frame; Pit Wall image is 2560 px wide.
    const C0 = { s: 0.6875, x: 0, y: 0 };
    const C1 = { s: 1.2, x: -839.6, y: -145 };   // tiles + P1 row
    const P = (nx, ny, c) => ({ x: 80 + c.x + nx * c.s, y: 154 + c.y + ny * c.s });
    const cam = (c, t, d, ease) => tl.to("#pw-cam", { scale: c.s, x: c.x, y: c.y, duration: d, ease: ease || "power2.inOut" }, t);
    const move = (p, t, d) => tl.to("#pw-cursor", { x: p.x, y: p.y, duration: d, ease: "power3.inOut" }, t);
    const click = (t, p) => {
      tl.to("#pw-cursor", { scale: 0.82, duration: 0.07, ease: "power2.in", transformOrigin: "0 0" }, t)
        .to("#pw-cursor", { scale: 1, duration: 0.12, ease: "power2.out" }, t + 0.07);
      tl.set("#pw-ripple", { x: p.x, y: p.y }, t);
      tl.fromTo("#pw-ripple", { scale: 0.3, opacity: 0.9 }, { scale: 1.6, opacity: 0, duration: 0.35, ease: "expo.out" }, t);
    };
    const roll = (id, t) => {
      tl.fromTo(id + "-a", { y: 0 }, { y: -76, duration: 0.3, ease: "power3.inOut" }, t);
      tl.fromTo(id + "-b", { y: 76 }, { y: 0, duration: 0.3, ease: "power3.inOut" }, t);
    };
    const cap = (show, hide, t) => {
      if (hide) tl.to(hide, { opacity: 0, filter: "blur(6px)", duration: 0.15 }, t - 0.15);
      tl.fromTo(show, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, t);
    };

    tl.set("#pw-cam", { scale: C0.s, x: 0, y: 0, transformOrigin: "0 0" }, 0);
    tl.set(["#pw-nbb", "#pw-nfl", "#pw-ncf"], { opacity: 1 }, 0);
    tl.set("#pw-cursor", { x: 1900, y: 1150, scale: 1 }, 0);

    // whip in from the right
    tl.fromTo("#pw-stage", { x: 1500 }, { x: 0, duration: 0.5, ease: "expo.out" }, 0);

    // Safety Car switch
    const sc = P(384, 54, C0);
    tl.fromTo("#pw-cursor", { opacity: 0 }, { opacity: 1, duration: 0.1 }, 0.9);
    move(sc, 0.9, 0.8);
    click(1.9, sc);
    tl.fromTo("#pw-sc", { opacity: 0 }, { opacity: 1, duration: 0.12 }, 1.92);
    tl.fromTo("#pw-knob", { x: 0 }, { x: 26, duration: 0.2, ease: "power3.out" }, 1.95);
    tl.fromTo("#pw-ticker", { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.45, ease: "expo.out" }, 2.05);
    tl.fromTo("#pw-ticker-text", { x: 0 }, { x: -1500, duration: 9.5, ease: "none" }, 2.05);
    tl.fromTo("#pw-amber", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 1.95)
      .to("#pw-amber", { opacity: 0.25, duration: 0.8, ease: "power2.out" }, 2.2);
    cap("#pw-cap1", null, 2.1);

    // punch in on the timing tower: advance P1 to Flying Lap
    cam(C1, 3.3, 0.6);
    const adv = P(975, 735, C1);
    move(adv, 3.4, 0.9);
    click(4.6, adv);
    tl.to("#pw-chip", { backgroundColor: "#10203f", borderColor: "#3b82f6", duration: 0.2 }, 4.62);
    tl.to("#pw-c1", { opacity: 0, y: -20, duration: 0.15 }, 4.62);
    tl.fromTo("#pw-c2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" }, 4.68);
    roll("#pw-nbb", 4.9);
    roll("#pw-nfl", 5.0);
    cap("#pw-cap2", "#pw-cap1", 4.75);

    // pull back, advance again to the Chequered Flag
    cam(C0, 6.2, 0.6);
    const adv0 = P(975, 735, C0);
    move(adv0, 6.4, 0.8);
    click(7.5, adv0);
    tl.to("#pw-chip", { backgroundColor: "#0f2a1c", borderColor: "#22c55e", duration: 0.2 }, 7.52);
    tl.to("#pw-c2", { opacity: 0, y: -20, duration: 0.15 }, 7.52);
    tl.fromTo("#pw-c3", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" }, 7.58);

    cap("#pw-cap3", "#pw-cap2", 7.65);
