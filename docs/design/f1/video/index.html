<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b0f17; }
      #root { width: 100%; height: 100%; }
      #ground { position: absolute; inset: 0; background: #0b0f17; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30"
         data-width="1920" data-height="1080" data-motion-blur="on">
      <div id="ground"></div>
      <div id="intro" data-composition-id="intro" data-composition-src="compositions/intro.html"
           data-start="0" data-duration="3.6" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>
      <div id="tracker" data-composition-id="tracker" data-composition-src="compositions/tracker.html"
           data-start="3.5" data-duration="10.6" data-track-index="2" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>
      <div id="pitwall" data-composition-id="pitwall" data-composition-src="compositions/pitwall.html"
           data-start="14" data-duration="11.6" data-track-index="3" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>
      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html"
           data-start="25.4" data-duration="4.6" data-track-index="4" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
