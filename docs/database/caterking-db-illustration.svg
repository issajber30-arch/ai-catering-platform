<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter></defs>
<rect width="1600" height="1000" rx="24" fill="#ffffff"/>
<text x="40" y="62" font-size="34" font-weight="800" fill="#0f172a">CaterKing database at a glance</text>
<text x="40" y="92" font-size="17" fill="#475569">18 tables in five groups. Each card says what the table holds and which table it belongs to.</text>
<rect x="40" y="115" width="520" height="500" rx="18" fill="#eaf6ee" stroke="#2f7d4f" stroke-width="2"/>
<circle cx="66" cy="145" r="8" fill="#2f7d4f"/>
<text x="84" y="152" font-size="21" font-weight="800" fill="#2f7d4f">Menu</text>
<rect x="60" y="165" width="480" height="54" rx="10" fill="#ffffff" stroke="#2f7d4f" stroke-width="1.2" filter="url(#sh)"/>
<text x="74" y="188" font-size="16" font-weight="700" fill="#0f172a" font-family="SFMono-Regular, Menlo, Consolas, monospace">dish_categories</text>
<text x="74" y="208" font-size="13.5" fill="#475569">Menu sections: salads, mains…</text>
<rect x="60" y="235" width="480" height="54" rx="10" fill="#ffffff" stroke="#2f7d4f" stroke-width="1.2" filter="url(#sh)"/>
<text x="74" y="258" font-size="16" font-weight="700" fill="#0f172a" font-family="SFMono-Regular, Menlo, Consolas, monospace">dishes</text>
<text x="74" y="278" font-size="13.5" fill="#475569">Name he/ar/en, price, unit</text>
<text x="528" y="258" font-size="12.5" text-anchor="end" fill="#2f7d4f" font-weight="600">↳ dish_categories</text>
<rect x="60" y="305" width="480" height="54" rx="10" fill="#ffffff" stroke="#2f7d4f" stroke-width="1.2" filter="url(#sh)"/>
<text x="74" y="328" font-size="16" font-weight="700" fill="#0f172a" font-family="SFMono-Regular, Menlo, Consolas, monospace">dish_dietary</text>
<text x="74" y="348" font-size="13.5" fill="#475569">Kashrut, vegetarian, vegan</text>
<text x="528" y="328" font-size="12.5" text-anchor="end" fill="#2f7d4f" font-weight="600">↳ dishes</text>
<rect x="60" y="375" width="480" height="54" rx="10" fill="#ffffff" stroke="#2f7d4f" stroke-width="1.2" filter="url(#sh)"/>
<text x="74" y="398" font-size="16" font-weight="700" fill="#0f172a" font-family="SFMono-Regular, Menlo, Consolas, monospace">dish_allergens</text>
<text x="74" y="418" font-size="13.5" fill="#475569">Dish ↔ allergen: contains / free</text>
<text x="528" y="398" font-size="12.5" text-anchor="end" fill="#2f7d4f" font-weight="600">↳ dishes</text>
<rect x="60" y="445" width="480" height="54" rx="10" fill="#ffffff" stroke="#2f7d4f" stroke-width="1.2" filter="url(#sh)"/>
<text x="74" y="468" font-size="16" font-weight="700" fill="#0f172a" font-family="SFMono-Regular, Menlo, Consolas, monospace">allergens</text>
<text x="74" y="488" font-size="13.5" fill="#475569">Peanuts, milk, gluten…</text>
<rect x="60" y="515" width="480" height="54" rx="10" fill="#ffffff" stroke="#2f7d4f" stroke-width="1.2" filter="url(#sh)"/>
<text x="74" y="538" font-size="16" font-weight="700" fill="#0f172a" font-family="SFMono-Regular, Menlo, Consolas, monospace">quantity_rules</text>
<text x="74" y="558" font-size="13.5" fill="#475569">Portions per adult / child</text>
<text x="528" y="538" font-size="12.5" text-anchor="end" fill="#2f7d4f" font-weight="600">↳ dish_categories</text>
<rect x="620" y="115" width="480" height="500" rx="18" fill="#fff1e8" stroke="#c2410c" stroke-width="2"/>
<circle cx="646" cy="145" r="8" fill="#c2410c"/>
<text x="664" y="152" font-size="21" font-weight="800" fill="#c2410c">Ordering</text>
<rect x="640" y="165" width="440" height="54" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="1.2" filter="url(#sh)"/>
<text x="654" y="188" font-size="16" font-weight="700" fill="#0f172a" font-family="SFMono-Regular, Menlo, Consolas, monospace">customers</text>
<text x="654" y="208" font-size="13.5" fill="#475569">Guest checkout: name, email or phone</text>
<rect x="640" y="235" width="440" height="54" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="1.2" filter="url(#sh)"/>
<text x="654" y="258" font-size="16" font-weight="700" fill="#0f172a" font-family="SFMono-Regular, Menlo, Consolas, monospace">events</text>
<text x="654" y="278" font-size="13.5" fill="#475569">Date, event type, guest counts</text>
<text x="1068" y="258" font-size="12.5" text-anchor="end" fill="#c2410c" font-weight="600">↳ customers</text>
<rect x="640" y="305" width="440" height="54" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="2.5" filter="url(#sh)"/>
<text x="654" y="328" font-size="16" font-weight="700" fill="#0f172a" font-family="SFMono-Regular, Menlo, Consolas, monospace">orders</text>
<text x="654" y="348" font-size="13.5" fill="#475569">Status, version, totals, delivery</text>
<text x="1068" y="328" font-size="12.5" text-anchor="end" fill="#c2410c" font-weight="600">↳ events</text>
<rect x="640" y="375" width="440" height="54" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="1.2" filter="url(#sh)"/>
<text x="654" y="398" font-size="16" font-weight="700" fill="#0f172a" font-family="SFMono-Regular, Menlo, Consolas, monospace">order_items</text>
<text x="654" y="418" font-size="13.5" fill="#475569">Dish × quantity, prices frozen on submit</text>
<text x="1068" y="398" font-size="12.5" text-anchor="end" fill="#c2410c" font-weight="600">↳ orders</text>
<text x="860" y="480" font-size="14.5" text-anchor="middle" fill="#9a3412" font-weight="600">Prices and totals are always calculated by the server</text>
<text x="860" y="503" font-size="14.5" text-anchor="middle" fill="#9a3412">draft → pending_approval → approved / rejected / cancelled</text>
<rect x="1160" y="115" width="400" height="500" rx="18" fill="#eaf1ff" stroke="#1d4ed8" stroke-width="2"/>
<circle cx="1186" cy="145" r="8" fill="#1d4ed8"/>
<text x="1204" y="152" font-size="21" font-weight="800" fill="#1d4ed8">Logistics</text>
<rect x="1180" y="165" width="360" height="54" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2" filter="url(#sh)"/>
<text x="1194" y="188" font-size="16" font-weight="700" fill="#0f172a" font-family="SFMono-Regular, Menlo, Consolas, monospace">time_slots</text>
<text x="1194" y="208" font-size="13.5" fill="#475569">Pickup / delivery hours, capacity</text>
<rect x="1180" y="235" width="360" height="54" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2" filter="url(#sh)"/>
<text x="1194" y="258" font-size="16" font-weight="700" fill="#0f172a" font-family="SFMono-Regular, Menlo, Consolas, monospace">delivery_zones</text>
<text x="1194" y="278" font-size="13.5" fill="#475569">Zone fees (older orders)</text>
<rect x="1180" y="305" width="360" height="54" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2" filter="url(#sh)"/>
<text x="1194" y="328" font-size="16" font-weight="700" fill="#0f172a" font-family="SFMono-Regular, Menlo, Consolas, monospace">blocked_dates</text>
<text x="1194" y="348" font-size="13.5" fill="#475569">Days with no orders</text>
<rect x="1180" y="375" width="360" height="54" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2" filter="url(#sh)"/>
<text x="1194" y="398" font-size="16" font-weight="700" fill="#0f172a" font-family="SFMono-Regular, Menlo, Consolas, monospace">geocode_cache</text>
<text x="1194" y="418" font-size="13.5" fill="#475569">Addresses → map coordinates</text>
<rect x="620" y="655" width="480" height="300" rx="18" fill="#f3edff" stroke="#7c3aed" stroke-width="2"/>
<circle cx="646" cy="685" r="8" fill="#7c3aed"/>
<text x="664" y="692" font-size="21" font-weight="800" fill="#7c3aed">AI assistant</text>
<rect x="640" y="705" width="440" height="54" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" filter="url(#sh)"/>
<text x="654" y="728" font-size="16" font-weight="700" fill="#0f172a" font-family="SFMono-Regular, Menlo, Consolas, monospace">ai_conversations</text>
<text x="654" y="748" font-size="13.5" fill="#475569">One chat per order</text>
<text x="1068" y="728" font-size="12.5" text-anchor="end" fill="#7c3aed" font-weight="600">↳ orders</text>
<rect x="640" y="775" width="440" height="54" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" filter="url(#sh)"/>
<text x="654" y="798" font-size="16" font-weight="700" fill="#0f172a" font-family="SFMono-Regular, Menlo, Consolas, monospace">ai_messages</text>
<text x="654" y="818" font-size="13.5" fill="#475569">Chat messages + token cost</text>
<text x="1068" y="798" font-size="12.5" text-anchor="end" fill="#7c3aed" font-weight="600">↳ ai_conversations</text>
<rect x="640" y="845" width="440" height="54" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" filter="url(#sh)"/>
<text x="654" y="868" font-size="16" font-weight="700" fill="#0f172a" font-family="SFMono-Regular, Menlo, Consolas, monospace">ai_change_proposals</text>
<text x="654" y="888" font-size="13.5" fill="#475569">Suggested changes, customer approves</text>
<text x="1068" y="868" font-size="12.5" text-anchor="end" fill="#7c3aed" font-weight="600">↳ orders</text>
<rect x="1160" y="655" width="400" height="170" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<circle cx="1186" cy="685" r="8" fill="#475569"/>
<text x="1204" y="692" font-size="21" font-weight="800" fill="#475569">Settings</text>
<rect x="1180" y="705" width="360" height="54" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.2" filter="url(#sh)"/>
<text x="1194" y="728" font-size="16" font-weight="700" fill="#0f172a" font-family="SFMono-Regular, Menlo, Consolas, monospace">business_settings</text>
<text x="1194" y="748" font-size="13.5" fill="#475569">One row: lead time, minimum, fees</text>
<rect x="40" y="655" width="520" height="300" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<circle cx="66" cy="685" r="8" fill="#475569"/>
<text x="84" y="692" font-size="21" font-weight="800" fill="#475569">How an order flows</text>
<circle cx="78" cy="730" r="16" fill="#0f172a"/>
<text x="78" y="735" font-size="15" font-weight="800" text-anchor="middle" fill="#fff">1</text>
<text x="106" y="729" font-size="16" font-weight="700" fill="#0f172a">Customer plans an event</text>
<text x="106" y="748" font-size="13" fill="#475569" font-family="SFMono-Regular, Menlo, Consolas, monospace">customers, events</text>
<circle cx="78" cy="786" r="16" fill="#0f172a"/>
<text x="78" y="791" font-size="15" font-weight="800" text-anchor="middle" fill="#fff">2</text>
<text x="106" y="785" font-size="16" font-weight="700" fill="#0f172a">Builds an order from the menu</text>
<text x="106" y="804" font-size="13" fill="#475569" font-family="SFMono-Regular, Menlo, Consolas, monospace">orders, order_items → dishes</text>
<circle cx="78" cy="842" r="16" fill="#0f172a"/>
<text x="78" y="847" font-size="15" font-weight="800" text-anchor="middle" fill="#fff">3</text>
<text x="106" y="841" font-size="16" font-weight="700" fill="#0f172a">AI may suggest changes; customer decides</text>
<text x="106" y="860" font-size="13" fill="#475569" font-family="SFMono-Regular, Menlo, Consolas, monospace">ai_change_proposals</text>
<circle cx="78" cy="898" r="16" fill="#0f172a"/>
<text x="78" y="903" font-size="15" font-weight="800" text-anchor="middle" fill="#fff">4</text>
<text x="106" y="897" font-size="16" font-weight="700" fill="#0f172a">Owner approves or rejects</text>
<text x="106" y="916" font-size="13" fill="#475569" font-family="SFMono-Regular, Menlo, Consolas, monospace">orders.status</text>
